<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case 4 · 매장 찾기</title>
    <style>
      :root {
        --semantic-text-tertiary: rgb(107 114 128);
        --semantic-status-positive: rgb(15 107 55);
        --semantic-status-negative: rgb(159 18 57);
        --semantic-border-primary: rgb(209 213 219);
        --semantic-focus-primary: rgb(245 158 11);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 360px;
        background: #f4f6f8;
        color: #111827;
        font-family: Arial, "Apple SD Gothic Neo", sans-serif;
      }

      main {
        width: 360px;
        min-height: 1824px;
        margin: 0 auto;
        background: #fff;
      }

      header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid #e5e7eb;
      }

      .brand {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .copy-button {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        margin: 0;
        padding: 0;
        border: 1px solid var(--semantic-border-primary);
        border-radius: 8px;
        color: var(--semantic-text-tertiary);
        background: #fff;
        font-size: 16px;
        line-height: 1;
      }

      .map {
        position: relative;
        height: 560px;
        overflow: hidden;
        background:
          linear-gradient(31deg, transparent 48%, #fff 49% 52%, transparent 53%),
          linear-gradient(121deg, transparent 47%, #d7f1dd 48% 54%, transparent 55%), #eaf1e9;
      }

      .map::before,
      .map::after {
        position: absolute;
        content: "";
        inset: 18% -10%;
        border: 16px solid rgb(255 255 255 / 80%);
        transform: rotate(-18deg);
      }

      .map::after {
        inset: -12% 42%;
        transform: rotate(24deg);
      }

      .pin {
        position: absolute;
        top: 236px;
        left: 154px;
        z-index: 1;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 4px solid #fff;
        border-radius: 50% 50% 50% 8px;
        transform: rotate(-45deg);
        color: #fff;
        background: #1d4ed8;
        box-shadow: 0 8px 20px rgb(15 23 42 / 24%);
      }

      .pin span {
        transform: rotate(45deg);
        font-size: 14px;
        font-weight: 800;
      }

      .panel {
        position: relative;
        z-index: 2;
        min-height: 620px;
        margin-top: -28px;
        padding: 12px 20px 40px;
        border-radius: 28px 28px 0 0;
        background: #fff;
      }

      .handle {
        width: 40px;
        height: 4px;
        margin: 0 auto 28px;
        border-radius: 99px;
        background: #d1d5db;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.35;
      }

      .address,
      .distance {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        margin-top: 18px;
        padding: 7px 12px;
        border-radius: 999px;
        color: #0f6b37;
        background: #dcfce7;
        font-size: 13px;
        font-weight: 700;
      }

      body[data-state="unavailable"] .status {
        color: #9f1239;
        background: #ffe4e6;
      }

      .chargers {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }

      .charger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 76px;
        padding: 18px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
      }

      .charger strong {
        font-size: 16px;
      }

      .charger span {
        color: #1d4ed8;
        font-size: 15px;
        font-weight: 800;
      }

      body[data-state="unavailable"] .charger span {
        color: #9ca3af;
      }

      .facts {
        display: grid;
        gap: 8px;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
        color: #374151;
        font-size: 14px;
      }

      .comparison {
        margin-top: 28px;
      }

      .comparison h2 {
        margin: 0 0 12px;
        font-size: 18px;
        line-height: 1.4;
      }

      .preview-pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .preview-pair img {
        display: block;
        width: 100%;
        height: 88px;
        border: 1px solid var(--semantic-border-primary);
        border-radius: 8px;
        background: #eaf1e9;
        object-fit: cover;
      }

      .icon-fixtures {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
      }

      .icon-fixture {
        width: 16px;
        height: 16px;
        display: inline-flex;
        flex-shrink: 0;
        align-self: center;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        line-height: 16px;
      }

      [data-icon="spot"] {
        color: var(--semantic-text-tertiary);
      }

      [data-icon="circle"] {
        color: var(--semantic-status-positive);
      }

      [data-icon="close"] {
        color: var(--semantic-status-negative);
      }

      .comparison-table {
        width: 100%;
        margin-top: 16px;
        border: 1px solid var(--semantic-border-primary);
        border-collapse: collapse;
        color: #374151;
        font-size: 13px;
      }

      .comparison-table th,
      .comparison-table td {
        padding: 8px;
        border: 1px solid var(--semantic-border-primary);
        text-align: left;
      }

      #action {
        width: 100%;
        height: 54px;
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        color: #fff;
        background: #1d4ed8;
        font-size: 16px;
        font-weight: 800;
      }

      button:focus-visible {
        outline: 3px solid var(--semantic-focus-primary);
        outline-offset: 3px;
      }

      body[data-state="unavailable"] #action {
        background: #9ca3af;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="brand">NX Plus Park</span>
        <button
          class="copy-button"
          data-ui="copy-button"
          id="copy-link"
          type="button"
          aria-label="비교 링크 복사"
        >
          ⧉
        </button>
      </header>
      <section class="map" aria-label="충전소 위치 지도">
        <div class="pin"><span>EV</span></div>
      </section>
      <section class="panel">
        <div class="handle" aria-hidden="true"></div>
        <h1 id="title"></h1>
        <p class="address" id="address"></p>
        <p class="distance" id="distance"></p>
        <span class="status" id="status"></span>
        <div class="chargers" id="chargers"></div>
        <ul class="facts" id="facts"></ul>
        <section class="comparison" aria-labelledby="comparison-title">
          <h2 id="comparison-title">화면 비교</h2>
          <div class="preview-pair">
            <img
              data-ui="left-image"
              alt="사용 가능 상태 미리보기"
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
            />
            <img
              data-ui="right-image"
              alt="사용 불가 상태 미리보기"
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
            />
          </div>
          <div class="icon-fixtures" aria-label="상태 아이콘">
            <span
              class="icon-fixture"
              data-icon="spot"
              data-export="Spot"
              data-state-prop="normal"
              data-token="--semantic-text-tertiary"
              aria-label="기본 상태"
              >●</span
            >
            <span
              class="icon-fixture"
              data-icon="circle"
              data-export="Circle"
              data-state-prop="available"
              data-token="--semantic-status-positive"
              aria-label="사용 가능"
              >○</span
            >
            <span
              class="icon-fixture"
              data-icon="close"
              data-export="Close"
              data-state-prop="unavailable"
              data-token="--semantic-status-negative"
              aria-label="사용 불가"
              >×</span
            >
          </div>
          <table class="comparison-table" data-ui="comparison-table">
            <thead>
              <tr>
                <th scope="col">항목</th>
                <th scope="col">검증값</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">아이콘</th>
                <td>16 × 16</td>
              </tr>
              <tr>
                <th scope="row">외곽선</th>
                <td>전체 표시</td>
              </tr>
            </tbody>
          </table>
          <p id="copy-result" role="status" aria-live="polite"></p>
        </section>
        <button type="button" id="action">길 안내 시작</button>
      </section>
    </main>
    <script type="module">
      const state = new URL(location.href).searchParams.get("state") ?? "available";
      const response = await fetch(`./${state}.json`);
      if (!response.ok) throw new Error(`fixture load failed: ${response.status}`);
      const fixture = await response.json();
      document.body.dataset.state = state;
      document.body.dataset.fixtureId = fixture.id;
      document.querySelector("#title").textContent = fixture.title;
      document.querySelector("#address").textContent = fixture.address;
      document.querySelector("#distance").textContent = fixture.distance;
      document.querySelector("#status").textContent = fixture.status;
      const stateFactRows = [
        ["CINEMA 4K", fixture.stateFacts.cinema4k],
        ["G패스 머니", fixture.stateFacts.gpassMoney ? "표시" : "숨김"],
        ["주차", fixture.stateFacts.parking],
      ];
      document.querySelector("#facts").replaceChildren(
        ...stateFactRows.map(([subject, value]) => {
          const row = document.createElement("li");
          row.dataset.subject = subject;
          row.textContent = `${subject}: ${value}`;
          return row;
        }),
      );
      document.querySelector("#chargers").replaceChildren(
        ...fixture.chargers.map((charger) => {
          const row = document.createElement("div");
          row.className = "charger";
          const label = document.createElement("strong");
          label.textContent = charger.label;
          const count = document.createElement("span");
          count.textContent = `${charger.available} / ${charger.total}`;
          row.append(label, count);
          return row;
        }),
      );
      const action = document.querySelector("#action");
      action.disabled = state === "unavailable";
      action.textContent = state === "unavailable" ? "현재 이용할 수 없어요" : "길 안내 시작";
      const copyButton = document.querySelector("#copy-link");
      const copyResult = document.querySelector("#copy-result");
      copyButton.addEventListener("click", () => {
        copyButton.dataset.copyResult = "copied";
        copyResult.textContent = "비교 링크를 복사했습니다";
      });
      await document.fonts.ready;
      window.__CASE4_READY__ = {
        fixtureId: fixture.id,
        assetCount: performance.getEntriesByType("resource").length,
        stateFacts: fixture.stateFacts,
      };
    </script>
  </body>
</html>
