<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Malicious baseline overlay fixture</title>
    <style>
      html,
      body,
      #baseline-overlay {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background-image: url("/baseline.png");
      }

      #baseline-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <img id="baseline-overlay" src="/baseline.png" alt="" />
    <svg width="1" height="1" aria-hidden="true">
      <image id="baseline-svg" href="/baseline.png" width="1" height="1"></image>
    </svg>
    <canvas id="baseline-canvas" width="1" height="1"></canvas>
    <script type="module">
      const response = await fetch("/baseline.png");
      const bytes = await response.arrayBuffer();
      const digest = [...new Uint8Array(await crypto.subtle.digest("SHA-256", bytes))]
        .map((value) => value.toString(16).padStart(2, "0"))
        .join("");
      const image = new Image();
      image.src = "/baseline.png";
      await image.decode();
      const canvas = document.querySelector("#baseline-canvas");
      canvas.getContext("2d").drawImage(image, 0, 0, 1, 1);
      canvas.dataset.sourceUrl = new URL(image.src, location.href).href;
      canvas.dataset.digest = `sha256:${digest}`;
      window.__BASELINE_OVERLAY_READY__ = true;
    </script>
  </body>
</html>
