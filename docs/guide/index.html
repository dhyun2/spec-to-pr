<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spec→pr · Documentation</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f6f9f8;
        --sidebar: #fbfcfc;
        --code-bg: #f4f8f6;
        --ink: #1a2622;
        --ink-strong: #0b1512;
        --muted: #586b67;
        --faint: #869591;
        --line: #e9eeec;
        --line2: #dde4e1;
        --brand: #0e8577;
        --brand-ink: #0a6055;
        --brand-soft: #e3f3ef;
        --amber: #9a6410;
        --amber-soft: #fbf1de;
        --red: #c0353c;
        --green: #2b8259;
        --violet: #5a4bd6;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR",
          Roboto, sans-serif;
        --hd: 62px;
        --sb: 296px;
        --toc: 240px;
      }
      :root[data-theme="dark"] {
        --bg: #0d1413;
        --bg-soft: #121b19;
        --sidebar: #0f1817;
        --code-bg: #0e1917;
        --ink: #d8e4e0;
        --ink-strong: #f1f7f5;
        --muted: #93a5a1;
        --faint: #61736f;
        --line: #1d2b28;
        --line2: #283a36;
        --brand: #31b8a9;
        --brand-ink: #63d8ca;
        --brand-soft: #12302c;
        --amber: #e0a54e;
        --amber-soft: #291f0f;
        --red: #ef767d;
        --green: #54c48c;
        --violet: #a99cff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.78;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.003em;
      }
      a {
        color: inherit;
      }
      code {
        font-family: var(--mono);
      }

      /* header */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--hd);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 26px;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: saturate(1.3) blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 11px;
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-decoration: none;
        font-size: 16px;
      }
      .logo .g {
        width: 29px;
        height: 29px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, var(--brand), #0a6055);
        color: #fff;
        font-weight: 800;
        font-size: 16px;
      }
      .logo b {
        color: var(--brand);
      }
      .ver {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line2);
        border-radius: 999px;
        padding: 2px 9px;
      }
      .hsp {
        flex: 1;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-soft);
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 7px 13px;
        min-width: 240px;
        color: var(--faint);
        font-size: 14px;
      }
      .search input {
        border: 0;
        background: transparent;
        outline: 0;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        width: 100%;
      }
      .hbtn {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line2);
        border-radius: 9px;
        padding: 7px 11px;
        cursor: pointer;
      }
      .hbtn:hover {
        color: var(--ink);
        border-color: var(--brand);
      }
      .menu-btn {
        display: none;
      }

      /* layout — roomy */
      .layout {
        display: grid;
        grid-template-columns: var(--sb) minmax(0, 1fr) var(--toc);
        max-width: 1680px;
        margin: 0 auto;
        padding-top: var(--hd);
      }
      nav.side {
        position: sticky;
        top: var(--hd);
        align-self: start;
        height: calc(100vh - var(--hd));
        overflow-y: auto;
        padding: 26px 14px 80px;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
      }
      nav.side::-webkit-scrollbar {
        width: 8px;
      }
      nav.side::-webkit-scrollbar-thumb {
        background: var(--line2);
        border-radius: 8px;
      }
      .sgrp {
        margin-bottom: 22px;
      }
      .sgrp > .t {
        font-size: 11px;
        font-family: var(--mono);
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 6px 13px;
        font-weight: 700;
      }
      .side a {
        display: flex;
        gap: 10px;
        align-items: baseline;
        text-decoration: none;
        color: var(--muted);
        font-size: 14px;
        padding: 7px 13px;
        border-radius: 9px;
        line-height: 1.45;
        cursor: pointer;
      }
      .side a .n {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        flex: 0 0 auto;
        min-width: 20px;
      }
      .side a:hover {
        background: var(--bg-soft);
        color: var(--ink);
      }
      .side a.active {
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-weight: 600;
      }
      .side a.active .n {
        color: var(--brand);
      }

      /* article — bigger, wider, airy */
      main {
        min-width: 0;
        padding: 52px 72px 140px;
        max-width: 960px;
      }
      .crumb {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--faint);
        margin-bottom: 20px;
        letter-spacing: 0;
      }
      .crumb b {
        color: var(--brand);
      }
      article h1 {
        font-size: 3rem;
        line-height: 1.08;
        letter-spacing: -0.035em;
        font-weight: 820;
        margin: 0 0 20px;
        color: var(--ink-strong);
        text-wrap: balance;
      }
      article .lead {
        font-size: 1.32rem;
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 40px;
        max-width: 70ch;
        letter-spacing: -0.01em;
      }
      article h2 {
        font-size: 1.95rem;
        letter-spacing: -0.025em;
        font-weight: 780;
        margin: 64px 0 18px;
        padding-top: 16px;
        color: var(--ink-strong);
        scroll-margin-top: calc(var(--hd) + 20px);
        text-wrap: balance;
        border-top: 1px solid var(--line);
      }
      article h2:first-of-type {
        border-top: 0;
      }
      article h2 .ko {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.55em;
        margin-left: 8px;
        letter-spacing: 0;
      }
      article h2 .tid {
        font-family: var(--mono);
        color: var(--brand);
        font-size: 0.6em;
        font-weight: 700;
      }
      article h3 {
        font-size: 1.32rem;
        font-weight: 720;
        margin: 38px 0 12px;
        color: var(--ink-strong);
        scroll-margin-top: calc(var(--hd) + 20px);
      }
      article h4 {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 24px 0 8px;
        color: var(--ink-strong);
      }
      article p {
        margin: 0 0 18px;
        max-width: 74ch;
      }
      article a.link {
        color: var(--brand-ink);
        text-decoration: none;
        border-bottom: 1px solid var(--brand-soft);
        cursor: pointer;
        font-weight: 500;
      }
      article a.link:hover {
        border-bottom-color: var(--brand);
      }
      article ul {
        margin: 0 0 20px;
        padding-left: 0;
        list-style: none;
        display: grid;
        gap: 11px;
        max-width: 74ch;
      }
      article ul li {
        position: relative;
        padding-left: 24px;
        line-height: 1.7;
      }
      article ul li::before {
        content: "›";
        position: absolute;
        left: 3px;
        color: var(--brand);
        font-family: var(--mono);
        font-weight: 700;
        font-size: 1.05em;
      }
      article ul li b {
        color: var(--ink-strong);
      }
      article ul li code,
      article p code,
      article h4 code {
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 0.84em;
      }
      .lbl {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--faint);
        font-weight: 700;
        margin: 30px 0 10px !important;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .lbl::before {
        content: "";
        width: 14px;
        height: 2px;
        background: var(--brand);
        border-radius: 2px;
      }

      .callout {
        border: 1px solid var(--line);
        border-left: 3px solid var(--brand);
        border-radius: 12px;
        padding: 16px 20px;
        margin: 18px 0;
        background: var(--bg-soft);
        max-width: 76ch;
      }
      .callout b {
        display: block;
        font-size: 12px;
        font-family: var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--brand-ink);
        margin-bottom: 6px;
      }
      .callout p {
        margin: 0;
        font-size: 15.5px;
        color: var(--ink);
      }
      .callout.why {
        border-left-color: var(--amber);
      }
      .callout.why b {
        color: var(--amber);
      }
      .callout.use {
        border-left-color: var(--green);
      }
      .callout.use b {
        color: var(--green);
      }
      .callout.role {
        border-left-color: var(--violet);
        background: transparent;
      }
      .callout.role b {
        color: var(--violet);
      }

      /* io grid */
      .io {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin: 14px 0;
        max-width: 76ch;
      }
      @media (max-width: 700px) {
        .io {
          grid-template-columns: 1fr;
        }
      }
      .io .box {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 13px 15px;
        background: var(--bg);
      }
      .io .box .k {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        font-weight: 700;
        margin-bottom: 7px;
      }
      .io .box code {
        font-size: 12.6px;
        color: var(--brand-ink);
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 5px;
        display: inline-block;
        margin: 2px 3px 2px 0;
      }
      .io .box.out code {
        color: var(--green);
      }

      /* who */
      .who {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin: 12px 0;
        font-size: 14.5px;
      }
      .who .wi {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .who .wk {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        font-weight: 700;
      }
      .who .wv {
        color: var(--brand-ink);
        font-family: var(--mono);
        font-size: 13.5px;
      }
      .who .wv.p {
        color: var(--muted);
      }

      /* run chips */
      .run {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 4px;
      }
      .pill {
        font-family: var(--mono);
        font-size: 12px;
        border-radius: 8px;
        padding: 4px 10px;
        border: 1px solid var(--line2);
        display: flex;
        gap: 7px;
        align-items: center;
        background: var(--bg);
      }
      .pill .k {
        font-size: 9.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .pill.skill {
        background: var(--brand-soft);
        border-color: transparent;
        color: var(--brand-ink);
      }
      .pill.none {
        border-style: dashed;
        color: var(--faint);
      }

      /* code card */
      .code {
        background: var(--code-bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        margin: 16px 0;
        max-width: 80ch;
      }
      .code .bar {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 9px 15px;
        border-bottom: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .code .bar .d {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line2);
      }
      .code .bar .fn {
        color: var(--ink);
        margin-left: 4px;
      }
      .code pre {
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 13.6px;
        line-height: 1.7;
        color: var(--ink);
      }
      .code pre::-webkit-scrollbar {
        height: 9px;
      }
      .code pre::-webkit-scrollbar-thumb {
        background: var(--line2);
        border-radius: 9px;
      }
      pre.dia {
        color: var(--muted);
        font-size: 13px;
      }
      pre.dia b {
        color: var(--brand-ink);
      }
      pre.dia i {
        color: var(--amber);
        font-style: normal;
      }
      pre .c {
        color: var(--faint);
      }
      pre .k {
        color: var(--brand-ink);
      }
      pre .s {
        color: var(--green);
      }
      pre .n {
        color: var(--amber);
      }
      pre .r {
        color: var(--red);
      }
      pre .p {
        color: var(--violet);
      }
      .fref {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        margin: 2px 0 8px;
      }
      .fref b {
        color: var(--brand-ink);
      }

      /* toc */
      aside.toc {
        position: sticky;
        top: var(--hd);
        align-self: start;
        height: calc(100vh - var(--hd));
        overflow-y: auto;
        padding: 52px 20px;
        font-size: 13.5px;
      }
      aside.toc .t {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--faint);
        font-weight: 700;
        margin-bottom: 14px;
      }
      aside.toc a {
        display: block;
        text-decoration: none;
        color: var(--muted);
        padding: 5px 12px;
        border-left: 2px solid var(--line);
        line-height: 1.45;
        margin-bottom: 2px;
      }
      aside.toc a.sub {
        padding-left: 24px;
        font-size: 13px;
      }
      aside.toc a:hover {
        color: var(--ink);
      }
      aside.toc a.active {
        color: var(--brand-ink);
        border-left-color: var(--brand);
        font-weight: 600;
      }

      /* pager */
      .pager {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 70px;
        border-top: 1px solid var(--line);
        padding-top: 26px;
      }
      .pager a {
        flex: 1;
        text-decoration: none;
        border: 1px solid var(--line2);
        border-radius: 12px;
        padding: 16px 20px;
        cursor: pointer;
      }
      .pager a:hover {
        border-color: var(--brand);
      }
      .pager .dir {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--faint);
      }
      .pager .ttl {
        color: var(--ink-strong);
        font-weight: 600;
        font-size: 16px;
      }
      .pager .nx {
        text-align: right;
      }

      /* tables */
      .tblwrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: 18px 0;
      }
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      table.tbl th,
      table.tbl td {
        text-align: left;
        padding: 10px 13px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      table.tbl th {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
        background: var(--bg-soft);
        position: sticky;
        top: 0;
      }
      table.tbl td.t {
        font-family: var(--mono);
        color: var(--brand);
        font-weight: 700;
        white-space: nowrap;
      }
      table.tbl td.m {
        font-family: var(--mono);
        color: var(--muted);
      }
      table.tbl td.m.none {
        color: var(--faint);
      }
      table.tbl tr:last-child td {
        border-bottom: 0;
      }
      table.tbl tr:hover td {
        background: var(--bg-soft);
      }

      /* note */
      .note {
        border: 1px solid var(--line2);
        border-radius: 13px;
        background: var(--bg-soft);
        padding: 16px 20px;
        margin: 20px 0;
        display: flex;
        gap: 14px;
        max-width: 78ch;
      }
      .note .ico {
        color: var(--brand);
        font-weight: 700;
        font-family: var(--mono);
        font-size: 13px;
        flex: 0 0 auto;
        margin-top: 2px;
      }
      .note p {
        margin: 0;
        font-size: 15px;
      }
      .note b {
        color: var(--ink-strong);
      }

      /* ---------- architecture ---------- */
      .arch {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--bg-soft);
        padding: 18px;
        overflow-x: auto;
      }
      .arch-inner {
        min-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .band {
        border: 1px solid var(--line2);
        border-radius: 13px;
        background: var(--bg);
        padding: 12px 14px;
      }
      .band .bh {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 9px;
        flex-wrap: wrap;
      }
      .band .bh .no {
        font-family: var(--mono);
        font-weight: 800;
        font-size: 12px;
        color: #fff;
        background: linear-gradient(150deg, var(--brand), #0a6055);
        border-radius: 7px;
        padding: 3px 8px;
      }
      .band .bh .nm {
        font-weight: 700;
        font-size: 14.5px;
        color: var(--ink-strong);
      }
      .band .bh .rg {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--brand);
        background: var(--brand-soft);
        border-radius: 6px;
        padding: 2px 6px;
        font-weight: 700;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tk {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink);
        background: var(--bg-soft);
        border: 1px solid var(--line2);
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
        transition: all 0.12s;
      }
      .tk b {
        color: var(--brand-ink);
      }
      .tk:hover {
        border-color: var(--brand);
        background: var(--brand-soft);
      }
      .tk.sel {
        border-color: var(--brand);
        background: var(--brand-soft);
        box-shadow: 0 0 0 2px var(--brand-soft);
      }
      .tk.static {
        cursor: default;
      }
      .tk.static:hover {
        border-color: var(--line2);
        background: var(--bg-soft);
      }
      .arrow {
        align-self: center;
        color: var(--faint);
        font-size: 16px;
        padding: 5px 0;
      }
      .lanes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 9px;
        margin-top: 5px;
      }
      @media (max-width: 560px) {
        .lanes {
          grid-template-columns: 1fr;
        }
      }
      .lane {
        border: 1px dashed var(--line2);
        border-radius: 10px;
        padding: 9px;
        background: var(--bg-soft);
      }
      .lane .lt {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 6px;
        font-weight: 700;
      }
      .lane .chips {
        flex-direction: column;
        align-items: flex-start;
      }
      .merge {
        text-align: center;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--brand-ink);
        margin-top: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }
      .band.foundation {
        border-color: var(--brand);
        background: var(--brand-soft);
      }
      .band.release {
        border-style: dashed;
      }
      .feedback {

      /* ============================ CONCEPT PAGES ============================ */
      function conceptMcp() {
        return `<p class="lead">모든 기능은 하나의 원리로 통신합니다: <b>MCP 서버를 child process로 띄우고 stdin/stdout으로 JSON-RPC를 주고받는다.</b></p>
  <h2 id="stdio">stdio란</h2>
  <p><code>stdio</code>는 HTTP 포트(<code>localhost:3000</code>)를 여는 게 아니라, 실행된 프로세스의 <b>표준 입력(stdin)/표준 출력(stdout)</b>을 통신 채널로 씁니다. host가 <code>node dist/mcp/server.js</code>를 실행하면 그 프로세스가 요청을 기다립니다.</p>
  ${code("원리", `Codex / Claude Host\n   │  ① node dist/mcp/server.js 실행\n   │  ② stdin 으로 JSON 요청\n   ▼\nspec-to-pr MCP Server  ── tool 실행 ──▶ ③ stdout 으로 JSON 응답\n   ▼\nCodex / Claude Host\n<span class="c">※ 로그는 stdout이 아니라 stderr로 → 통신이 안 깨짐</span>`, true)}
  <h2 id="listcall">tools/list 와 tools/call</h2>
  <p>host는 먼저 <code>tools/list</code>로 “이 서버에 어떤 tool과 입력 스키마가 있는지”를 받고, 그 목록에 맞춰서만 <code>tools/call</code>을 보냅니다.</p>
  ${code("tools/list 응답 — 메뉴판", `{ "result": { "tools": [\n  { "name": <span class="p">"kernel_info"</span> }, { "name": <span class="p">"kernel_ping"</span> },\n  { "name": <span class="p">"create_run"</span> }, { "name": <span class="p">"generate_openspec_change"</span> },\n  { "name": <span class="p">"run_quality_gates"</span> }\n]}}`)}
  <h2 id="routing">호출 규격 — name이 라우팅 키</h2>
  <p>규격(<code>method:"tools/call"</code>)은 <b>고정</b>입니다. <code>params.name</code>이 어떤 tool을 부를지 정하고, <code>params.arguments</code>가 그 tool의 input schema에 맞춘 인자입니다.</p>
  ${code("고정 규격", `{\n  "method": <span class="s">"tools/call"</span>,\n  "params": {\n    "name": <span class="p">"호출할_tool_이름"</span>,      <span class="c">// 라우팅 키</span>\n    "arguments": { <span class="c">/* 그 tool의 input schema */</span> }\n  }\n}`)}
  <p>서버 내부에서는 이렇게 등록돼 있습니다.</p>
  ${code("server.registerTool", `server.registerTool(<span class="s">"kernel_ping"</span>,\n  { inputSchema: KernelPingInputSchema.shape,\n    outputSchema: KernelPingOutputSchema.shape },\n  <span class="k">async</span> (input) => { <span class="c">// input === params.arguments</span> });`)}
  <h2 id="others">다른 tool도 전부 같은 방식</h2>
  <p>이름과 arguments만 달라질 뿐, 통신은 동일합니다.</p>
  ${code("create_run", `{ "method":"tools/call","params":{ "name":<span class="p">"create_run"</span>,\n  "arguments":{ "projectRoot":<span class="s">"/…/spec-to-pr"</span> } } }\n<span class="c">→ RunService → RunManifest 생성 → SQLite 저장 → RunSummary</span>`)}

  ${code("run_quality_gates", `{ "name":<span class="p">"run_quality_gates"</span>,\n  "arguments":{ "runId":"run_…","worktreePath":"/tmp/…" } }\n<span class="c">→ scripts 탐색 → lint/typecheck/build/test 실행 → CheckResult</span>`)}
  <div class="note"><span class="ico">요약</span><p><b>stdio</b> = 통신 방식 · <b>tools/list</b> = 메뉴판 · <b>tools/call</b> = 메뉴 실행 · 각 handler = 내부 service 호출 · 결과는 <code>structuredContent</code>로 반환. host(AI)는 내부 TypeScript를 import하는 게 아니라 JSON 요청을 보내고, 서버가 코드를 실행합니다.</p></div>`;

   <p class="lead">스킬 하나로 전체를 실행하거나, 결정론적 검증 명령으로 플러그인 자체를 점검합니다.</p>

     <li><b>remote 감지</b> — github.com·gitlab.com 자동 감지 + <b>self-hosted 휴리스틱</b> + <code>SPEC_TO_PR_GIT_HOST</code>·<code>SPEC_TO_PR_API_BASE_URL</code>·<code>SPEC_TO_PR_WEB_BASE_URL</code> override</li>

   </ul>

   <p class="lbl" style="margin-top:26px">근거</p><p style="color:var(--muted);font-size:14px">이 문서는 저장소의 <code>docs/ROADMAP</code> · <code>docs/tasks/01…33</code> · <code>src/</code> · <code>schemas/runtime</code> · <code>skills/</code> · <code>agents/</code> · <code>tests/</code>를 근거로 작성되었습니다.</p>`,

      ];

      /* ============================ RUNTIME ============================ */
      const sideEl = document.getElementById("side"),
        artEl = document.getElementById("article"),
        tocEl = document.getElementById("toc"),
        crumbEl = document.getElementById("crumb"),
        pagerEl = document.getElementById("pager");
      const groupsOrder = ["시작하기", "개념", "파이프라인", "스킬", "레퍼런스"];
      function buildSide() {
        sideEl.innerHTML = "";
        groupsOrder.forEach((g) => {
          const items = PAGES.filter((p) => p.group === g);
          if (!items.length) return;
          const w = document.createElement("div");
          w.className = "sgrp";
          w.innerHTML = `<div class="t">${g}</div>`;
          items.forEach((p) => {
            const a = document.createElement("a");
            a.dataset.id = p.id;
            const num = (p.nav.match(/^\d/) || [""])[0];
            a.innerHTML = `<span class="n">${num || ""}</span><span>${p.nav.replace(/^\d\s·\s/, "")}</span>`;
            a.onclick = () => goHash(p.id);
            w.appendChild(a);
          });
          sideEl.appendChild(w);
        });
      }
      let io = null;
      function buildToc() {
        const heads = [...artEl.querySelectorAll("h2[id],h3[id]")];
        tocEl.innerHTML = "";
        if (io) io.disconnect();
        heads.forEach((h) => {
          const a = document.createElement("a");
          a.href = "#";
          a.dataset.tid = h.id;
          a.className = h.tagName === "H3" ? "sub" : "";
          const clone = h.cloneNode(true);
          clone.querySelectorAll(".tid,.ko").forEach((x) => x.remove());
          a.textContent = clone.textContent
            .replace(/^\s*·\s*/, "")
            .replace(/\s+/g, " ")
            .trim();
          a.onclick = (e) => {
            e.preventDefault();
            h.scrollIntoView();
          };
          tocEl.appendChild(a);
        });
        io = new IntersectionObserver(
          (es) => {
            es.forEach((e) => {
              if (e.isIntersecting)
                tocEl
                  .querySelectorAll("a")
                  .forEach((x) => x.classList.toggle("active", x.dataset.tid === e.target.id));
            });
          },
          { rootMargin: "-70px 0px -70% 0px" },
        );
        heads.forEach((h) => io.observe(h));
      }
      function render(id) {
        const idx = Math.max(
          0,
          PAGES.findIndex((p) => p.id === id),
        );
        const p = PAGES[idx];
        document.body.classList.toggle("archmode", p.id === "architecture");
        crumbEl.innerHTML =
          p.crumb.replace(/·\s([^·]+)$/, "· <b>$1</b>") +
          (p.range ? ` &nbsp;·&nbsp; <span style="color:var(--brand)">${p.range}</span>` : "");
        artEl.innerHTML = `<h1>${p.title}</h1>` + p.render();
        window.scrollTo(0, 0);
        [...sideEl.querySelectorAll("a")].forEach((a) =>
          a.classList.toggle("active", a.dataset.id === p.id),
        );
        const act = sideEl.querySelector("a.active");
        if (act) act.scrollIntoView({ block: "nearest" });
        const prev = PAGES[idx - 1],
          next = PAGES[idx + 1];
        pagerEl.innerHTML =
          (prev
            ? `<a onclick="goHash('${prev.id}')"><div class="dir">← 이전</div><div class="ttl">${prev.title}</div></a>`
            : '<span style="flex:1"></span>') +
          (next
            ? `<a class="nx" onclick="goHash('${next.id}')"><div class="dir">다음 →</div><div class="ttl">${next.title}</div></a>`
            : '<span style="flex:1"></span>');
        buildToc();
        if (p.onRender) p.onRender();
        closeMenu();
      }
      function goHash(id) {
        location.hash = "#/" + id;
      }
      window.goHash = goHash;
      window.fillArchDetail = fillArchDetail;
      function onHash() {
        const id = location.hash.replace("#/", "") || "intro";
        render(PAGES.some((p) => p.id === id) ? id : "intro");
      }
      window.addEventListener("hashchange", onHash);

      const q = document.getElementById("q");
      q.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const s = q.value.trim().toLowerCase();
        if (!s) return;
        const tm = s.match(/t\s?(\d{1,2})/);
        if (tm) {
          const n = +tm[1];
          const ch =
            n <= 5
              ? "ch1"
              : n <= 13
                ? "ch2"
                : n <= 17
                  ? "ch3"
                  : n <= 21
                    ? "ch4"
                    : n <= 23
                      ? "ch5"
                      : n <= 29
                        ? "ch6"
                        : n <= 32
                          ? "ch7"
                          : "ch8";
          goHash(ch);
          setTimeout(() => {
            const el = document.getElementById("T" + String(n).padStart(2, "0"));
            if (el) el.scrollIntoView();
          }, 90);
          return;
        }
        if (s.includes("스킬") || s.includes("skill")) {
          goHash("skills");
          return;
        }
        if (s.includes("아키") || s.includes("arch")) {
          goHash("architecture");
          return;
        }
        if (s.includes("매핑") || s.includes("map")) {
          goHash("map");
          return;
        }
        if (s.includes("mcp") || s.includes("통신") || s.includes("stdio")) {
          goHash("concept-mcp");
          return;
        }
        if (s.includes("저장") || s.includes("store") || s.includes("sqlite")) {
          goHash("concept-store");
          return;
        }
        const sk = SK.find((x) => x.id && x.id.includes(s));
        if (sk) {
          goHash("skills");
          setTimeout(() => {
            const el = document.getElementById("sk-" + sk.id);
            if (el) el.scrollIntoView();
          }, 90);
          return;
        }
      });

      document.getElementById("themeBtn").onclick = () => {
        const cur =
          document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", cur);
        try {
          localStorage.setItem("s2p-theme", cur);
        } catch (e) {}
      };
      try {
        const saved = localStorage.getItem("s2p-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
      const menuBtn = document.getElementById("menuBtn"),
        backdrop = document.getElementById("backdrop");
      function closeMenu() {
        sideEl.classList.remove("open");
        backdrop.classList.remove("on");
      }
      menuBtn.onclick = () => {
        sideEl.classList.toggle("open");
        backdrop.classList.toggle("on");
      };
      backdrop.onclick = closeMenu;

      buildSide();
      onHash();
