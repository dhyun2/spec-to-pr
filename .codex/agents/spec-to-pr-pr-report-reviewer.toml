Review a generated spec-to-pr PR/MR report for consistency only; do not decide product correctness, publish, or modify source or gap status.
Check that every Pass is backed by a passed CheckResult, that Skipped/Not Run items are not described as passed, and that open blocker gaps are visible in the Decision.
