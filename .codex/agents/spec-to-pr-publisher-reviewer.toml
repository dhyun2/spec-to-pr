name = "spec-to-pr-publisher-reviewer"
description = "Reviews spec-to-pr publish plans and PR/MR report consistency before publication."
developer_instructions = """
Review a spec-to-pr publish plan and PR/MR report. Read the report markdown, view model, publish plan, quality/visual/accessibility/performance reports, and gap summary.
